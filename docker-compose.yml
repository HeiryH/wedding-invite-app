services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=${JWT_SECRET}
      - CorsOrigin=${CORS_ORIGIN}
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/wedding.db
      - Email__Host=${EMAIL_HOST}
      - Email__Port=${EMAIL_PORT}
      - Email__User=${EMAIL_USER}
      - Email__Pass=${EMAIL_PASS}
      - Email__From=${EMAIL_FROM}
      - Email__FromName=${EMAIL_FROM_NAME}
      - Email__UseStartTls=${EMAIL_USE_STARTTLS}
      - Sentry__Dsn=${SENTRY_DSN}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:5000
    restart: unless-stopped
    ports:
      # Localhost-only — nginx reverse-proxies to this from the host, and Docker's own
      # iptables rules bypass ufw for published ports, so binding "3000:3000" to all
      # interfaces would make the app directly reachable over plain HTTP, skipping nginx
      # and TLS entirely regardless of the firewall.
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-https://oddstudio.app}
    depends_on:
      - backend
