services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=${JWT_SECRET}
      - CorsOrigin=${CORS_ORIGIN}
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/wedding.db
      - Email__Host=${EMAIL_HOST}
      - Email__Port=${EMAIL_PORT}
      - Email__User=${EMAIL_USER}
      - Email__Pass=${EMAIL_PASS}
      - Email__From=${EMAIL_FROM}
      - Email__FromName=${EMAIL_FROM_NAME}
      - Email__UseStartTls=${EMAIL_USE_STARTTLS}
      - Sentry__Dsn=${SENTRY_DSN}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:5000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
